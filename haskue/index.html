<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haskue WebAssembly example</title>
    <style>
      body {
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font: 16px/1.5 system-ui, sans-serif;
      }

      textarea,
      pre {
        box-sizing: border-box;
        width: 100%;
        padding: 0.75rem;
        font: 14px/1.5 ui-monospace, monospace;
      }

      textarea {
        min-height: 9rem;
      }

      pre {
        min-height: 6rem;
        overflow: auto;
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <h1>Haskue in Chrome</h1>

    <label for="source">CUE input</label>
    <textarea id="source">message: "hello from WebAssembly"
answer: 40 + 2</textarea>

    <p><button id="run" type="button">Export as JSON</button></p>

    <label for="output">Output</label>
    <pre id="output">Loading haskue.wasm…</pre>

    <script type="module" src="./main.js"></script>
  </body>
</html>
